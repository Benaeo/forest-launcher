name: Build and publish release

# Branch pushes and pull requests NEVER publish a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    outputs:
      version: ${{ steps.source.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag matching the CMake source version
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 scripts/release.py validate --tag "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    needs: validate
    uses: ./.github/workflows/native-packages.yml

  publish:
    needs: [validate, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: build/release-assets
          merge-multiple: true
      - name: Require exactly the three native binary packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py verify-assets --tag "$RELEASE_TAG" --output build/release-assets
      - name: Publish only after every package succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The tagged changelog is the source of truth. No manually prepared
          # draft is needed, and invalid notes fail before touching GitHub.
          python3 scripts/release.py notes --tag "$RELEASE_TAG" > build/release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > build/release-draft.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("build/release-draft.json").read_text())
          if release.get("isDraft") is not True:
              raise SystemExit("This release is already public; refusing to overwrite its assets.")
          PY
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file build/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file build/release-notes.md
          fi
          # A failed upload leaves a draft, not a partially published release.
          gh release upload "$RELEASE_TAG" build/release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
