name: Build and verify installation
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev python3
      - name: Configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Verify install layout
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/forest"
          mv backend backend-unavailable
          trap 'mv backend-unavailable backend' EXIT
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/forest/bin/forest-launcher" --smoke-test
